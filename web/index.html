<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Laigter Web MVP</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app">
      <header class="toolbar">
        <div class="brand">
          <span class="mark" aria-hidden="true"></span>
          <span>Laigter Web MVP</span>
        </div>
        <div class="actions">
          <label class="file-button" for="imageInput">
            <span aria-hidden="true">+</span>
            <span>Open</span>
          </label>
          <input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp">
          <button id="sampleButton" type="button">Sample</button>
          <button id="exportButton" type="button">Export PNG</button>
        </div>
      </header>

      <section class="workspace">
        <section class="preview-area" aria-label="Preview">
          <div class="preview-head">
            <div class="segmented" role="group" aria-label="Preview mode">
              <button class="active" data-mode="split" type="button">Split</button>
              <button data-mode="lit" type="button">Lit</button>
              <button data-mode="normal" type="button">Normal</button>
              <button data-mode="diffuse" type="button">Diffuse</button>
            </div>
            <output id="status">Ready</output>
          </div>
          <canvas id="previewCanvas" width="960" height="640"></canvas>
        </section>

        <aside class="controls" aria-label="Normal controls">
          <div class="panel-title">Render</div>

          <div class="toggles preview-toggles">
            <label><input id="pixelated" type="checkbox"> Pixelated</label>
            <label><input id="toon" type="checkbox"> Toon</label>
          </div>

          <label class="range-row">
            <span>Light Height</span>
            <input id="lightHeight" type="range" min="5" max="100" value="30">
            <output for="lightHeight">30</output>
          </label>

          <div class="panel-title">Normal</div>

          <label class="range-row">
            <span>Depth</span>
            <input id="normalDepth" type="range" min="0" max="4000" value="250">
            <output for="normalDepth">250</output>
          </label>

          <label class="range-row">
            <span>Blur</span>
            <input id="normalBlur" type="range" min="0" max="40" value="6">
            <output for="normalBlur">6</output>
          </label>

          <label class="range-row">
            <span>Bevel Depth</span>
            <input id="biselDepth" type="range" min="0" max="4000" value="100">
            <output for="biselDepth">100</output>
          </label>

          <label class="range-row">
            <span>Bevel Width</span>
            <input id="biselDistance" type="range" min="0" max="255" value="60">
            <output for="biselDistance">60</output>
          </label>

          <label class="range-row">
            <span>Bevel Blur</span>
            <input id="biselBlur" type="range" min="0" max="40" value="10">
            <output for="biselBlur">10</output>
          </label>

          <div class="toggles">
            <label><input id="softBisel" type="checkbox" checked> Soft bevel</label>
            <label><input id="invertX" type="checkbox"> Invert X</label>
            <label><input id="invertY" type="checkbox"> Invert Y</label>
            <label><input id="invertZ" type="checkbox"> Invert Z</label>
            <label><input id="useAlpha" type="checkbox"> Use alpha</label>
          </div>
        </aside>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
