name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # scripts/*.py are stdlib-only (no pip install step needed).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Generated-map regression baseline
        run: make baseline-check

      - name: Production build
        run: npm run build

      - name: Install browser for UI tests
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e

      - name: Upload golden output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-output
          path: |
            tests/golden/current/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
