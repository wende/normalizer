name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # The golden harness reads laigter/images/sample.png, so the submodule
      # is required — not optional reference material for this job.
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # scripts/*.py are stdlib-only (no pip install step needed).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: npm ci

      - name: Unit tests
        run: npm test

      # Drives the JS CLI over every manifest case. This is a crash/contract
      # check, not a correctness gate: it writes output but diffs nothing.
      # Upstream parity was deliberately abandoned (docs/NORMALIZER_FEATURES.md),
      # so tests/golden/upstream/ is NOT a valid comparison target.
      - name: Golden harness (CLI smoke)
        run: make js-smoke

      # Self-consistency only: renders the preview cases twice from the SAME
      # code and diffs them. Catches nondeterminism, NOT regressions — a change
      # to shared/ moves both sides together and still passes (verified: a
      # normalDepth edit leaves this green).
      #
      # LIMITATION: nothing in this job fails when shared/ output changes.
      # A real correctness gate needs a committed self-baseline (the JS output
      # blessed as the reference) plus a diff step against it. That is the
      # golden-harness repurposing in docs/NORMALIZER_FEATURES.md §2 —
      # see PUBLISH_CHECKLIST.md #7.
      - name: Preview self-consistency
        run: make preview-self-check

      - name: Production build
        run: npm run build

      - name: Upload golden output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-output
          path: |
            tests/golden/node/
            tests/golden/node-rerun/
          retention-days: 7
          if-no-files-found: ignore
