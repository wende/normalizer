[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "normalcy"
version = "0.1.0"
description = "Sprite-aware normal, height, AO, and specular map generation toolkit."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [
  { name = "normalcy contributors" }
]
dependencies = [
  "httpx>=0.27",
  "imageio>=2.34",
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "orjson>=3.10",
  "pillow>=10.3",
  "platformdirs>=4.2",
  "pydantic>=2.7",
  "rich>=13.7",
  "scikit-image>=0.23",
  "scipy>=1.13",
  "tqdm>=4.66",
  "typer>=0.12",
  "typing-extensions>=4.12"
]

[project.optional-dependencies]
ai = [
  "einops>=0.8",
  "huggingface-hub>=0.25",
  "onnx>=1.16",
  "onnxruntime>=1.20",
  "safetensors>=0.4"
]
preview = [
  "fastapi>=0.115",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.30"
]
lab = [
  "accelerate>=0.33",
  "diffusers>=0.30",
  "kornia>=0.7",
  "timm>=1.0",
  "torch>=2.4",
  "torchvision>=0.19",
  "transformers>=4.44"
]
cuda = [
  "onnxruntime-gpu>=1.20; platform_system == 'Linux' or platform_system == 'Windows'"
]
directml = [
  "onnxruntime-directml>=1.20; platform_system == 'Windows'"
]
dev = [
  "mypy>=1.10",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "scipy-stubs>=1.14"
]

[project.scripts]
normalcy = "normalcy.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/normalcy"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["normalcy"]

[[tool.mypy.overrides]]
module = ["onnxruntime.*", "cv2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

